name: agent
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  go_router: ^17.3.0
  window_manager: ^0.5.2
  lucide_icons_flutter: ^3.1.14+2
  xterm2: ^5.0.0
  path: ^1.9.0
  meta: ^1.18.0
  flutter_pty_new: ^1.0.0
  nanoid: ^1.0.0
  ansi_strip: ^0.1.1+1
  desktop_drop: ^0.7.1
  flutter_rust_bridge: 2.12.0
  streamdown: ^0.1.1
  fleather: ^1.27.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  signals_hooks: ^7.1.0
  reactive_forms: ^18.2.2
  desktop_multi_window: ^0.3.0
  freezed_annotation: ^3.0.0
  code_forge:
    path: .patches/code_forge
  re_highlight: ^0.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.0.0

flutter:
