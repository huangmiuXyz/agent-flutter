name: agent
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.3+1
  go_router: ^17.5.0
  window_manager: ^0.5.2
  lucide_icons_flutter: ^3.1.14+2
  xterm2: ^5.2.0
  path: ^1.9.0
  meta: ^1.18.0
  flutter_pty_new: ^1.0.0
  nanoid: ^1.0.0
  ansi_strip: ^0.1.1+1
  desktop_drop: ^0.7.1
  flutter_rust_bridge: 2.12.0
  streamdown:
    path: .patches/streamdown
  fleather: ^1.27.0
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  signals_hooks: ^7.1.0
  reactive_forms: ^18.2.2
  desktop_multi_window: ^0.3.0
  watcher: ^1.2.1
  file_picker: ^12.0.0-beta.7
  google_fonts: ^8.2.0
  path_provider: ^2.1.6
  flutter_local_notifications: ^22.3.0
  llamadart: ^0.8.20

dependency_overrides:
  # 本地 patch llamadart：修复思考模式下正文 content 被抑制攒批、
  # 导致流式接口不逐 token 输出的问题（见 .patches/llamadart）。
  # 上游修复后移除此 override 并删掉 .patches/llamadart。
  llamadart:
    path: .patches/llamadart

  code_forge:
    path: .patches/code_forge
  re_highlight: ^0.0.3
  freezed_annotation: ^3.0.0
  marionette_flutter: ^0.6.0
  win32: 6.4.0
  ffi: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  build_runner: ^2.4.0

flutter:
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono/JetBrainsMono-Regular.ttf
    - family: MaterialIcons
      fonts:
        - asset: assets/fonts/MaterialIcons-Regular.otf
